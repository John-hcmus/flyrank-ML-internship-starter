<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 264 64" width="264" height="64"
     role="img" aria-labelledby="fgb-title">
  <title id="fgb-title">FlyRank AI Fluency Internship — Graduate, 2026</title>
  <defs>
    <linearGradient id="fgb-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123a5c"/>
      <stop offset="1" stop-color="#0b2942"/>
    </linearGradient>
    <linearGradient id="fgb-seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ab0f2"/>
      <stop offset="1" stop-color="#2f7fc4"/>
    </linearGradient>
  </defs>

  <!-- plate -->
  <rect x="0.5" y="0.5" width="263" height="63" rx="10" fill="url(#fgb-plate)"/>
  <rect x="0.5" y="0.5" width="263" height="63" rx="10" fill="none" stroke="#2b5f8c"/>

  <!-- seal: a rising rank, ringed -->
  <g transform="translate(32 32)">
    <circle r="20" fill="url(#fgb-seal)" opacity="0.16"/>
    <circle r="20" fill="none" stroke="#5ab0f2" stroke-width="1.5"/>
    <circle r="15.5" fill="none" stroke="#5ab0f2" stroke-width="0.75" opacity="0.55"/>
    <!-- three bars climbing, and the arrow that clears them -->
    <rect x="-9.5" y="1" width="4.5" height="7.5" rx="1.2" fill="#9fd2fb"/>
    <rect x="-2.25" y="-3" width="4.5" height="11.5" rx="1.2" fill="#c9e6fd"/>
    <rect x="5" y="-8" width="4.5" height="16.5" rx="1.2" fill="#ffffff"/>
    <path d="M-10 -6.5 L-1 -11.5 L8.5 -14" fill="none" stroke="#ffffff"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>

  <!-- divider -->
  <line x1="63" y1="16" x2="63" y2="48" stroke="#2b5f8c" stroke-width="1"/>

  <!-- wordmark -->
  <g font-family="'IBM Plex Sans','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif">
    <text x="77" y="24" fill="#ffffff" font-size="14" font-weight="700"
          letter-spacing="1.7">FLYRANK</text>
    <text x="77" y="39.5" fill="#bcd9f2" font-size="10.5" font-weight="500">AI Fluency Internship</text>
    <text x="77" y="52.5" fill="#5ab0f2" font-size="9" font-weight="600"
          letter-spacing="1.15">GRADUATE · 2026</text>
  </g>
</svg>
